# Stromkreis-Testinstanz von EEG-Faktura auf "server" (docs/eegfaktura-lokal.md).
# Wird von docker compose automatisch zusaetzlich zu docker-compose.yaml geladen;
# die Upstream-Datei bleibt unveraendert und per Tarball aktualisierbar.
#
# Abweichungen vom Upstream-Stack:
# - Healthcheck: /health/ready liegt bei Keycloak 26 auf dem Management-Port 9181.
# - Port 8080 ist am Server durch Nextcloud AIO belegt: Keycloak laeuft innen
#   wie aussen auf 8180 (KC_HTTP_PORT), damit der Unified Hostname stimmt.
# - Unified Hostname ist server.fritz.box:8180 (Browser: Fritzbox-DNS;
#   Container: extra_hosts host-gateway auf den veroeffentlichten Port).
#   Token-iss == JWKS-URL, keine hosts-Datei-Aenderung am Client noetig.
# - eda, billing, postfix laufen nicht (Profil "full"): keine Netzbetreiber-
#   Anbindung, Abrechnung ausserhalb des Stromkreis-Scopes.

x-kc-host: &kc-host
  extra_hosts:
    - "server.fritz.box:host-gateway"

services:
  eegfaktura-keycloak:
    environment:
      KC_HTTP_PORT: "8180"
      KEYCLOAK_FRONTEND_URL: "http://server.fritz.box:8180"
      KC_HOSTNAME: "http://server.fritz.box:8180"
    ports: !override
      - "8180:8180"
      - "127.0.0.1:9181:9181"
    healthcheck:
      test: [
        "CMD-SHELL",
        "exec 3<>/dev/tcp/localhost/9181; echo -en 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; if timeout 3 cat <&3 | grep -m 1 'UP'; then exec 3<&-; exec 3>&-; exit 0; else exec 3<&-; exec 3>&-; exit 1; fi"
      ]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 40

  eegfaktura-web:
    <<: *kc-host
    environment:
      KEYCLOAK_URL: "http://server.fritz.box:8180"

  eegfaktura-admin-web:
    <<: *kc-host
    environment:
      KEYCLOAK_URL: "http://server.fritz.box:8180"

  eegfaktura-admin-backend:
    <<: *kc-host
    environment:
      KEYCLOAK_URL: "http://server.fritz.box:8180"
      # Admin-API-Zugang fuer das Anlegen der EEG-Admin-Benutzer. Das Image liest
      # NICHT keycloak.json (KEYCLOAK_CONFIG_JSON ist in application.conf auskommentiert),
      # sondern diese Variable; ohne sie gilt ein eingebautes Default-Secret -> 401
      # (Upstream-Issue #27). Wert kommt aus .env (Symlink auf secrets.env).
      KEYCLOAK_ADMIN_CLI_SECRET: "${ADMIN_CLI_SECRET:?ADMIN_CLI_SECRET fehlt in .env}"

  eegfaktura-backend:
    <<: *kc-host
    # Das Registry-Image ghcr.io/eegfaktura/vfeeg-backend:latest stammt vom 30.5.2026
    # und beantwortet authentifizierte Anfragen (GET /eeg, Stammdaten-Upload) mit
    # 200 ohne Body und ohne Wirkung. Deshalb aus dem aktuellen master gebaut:
    # build/build-backend.sh (Quelle als Tarball, docker build -t vfeeg-backend:local).
    image: vfeeg-backend:local

  eegfaktura-energystore:
    <<: *kc-host
    environment:
      # Upstream setzt "ENERGYSTORE_SERVICES_master-server" (kleingeschrieben); viper
      # sucht die GROSSGESCHRIEBENE Variable, findet sie nicht und waehlt localhost:9092.
      # Folge: rawdata ohne "cps" scheitert mit "error fetch Meteringpoints".
      ENERGYSTORE_SERVICES_MASTER-SERVER: "eegfaktura-backend:9092"

  eegfaktura-filestore:
    <<: *kc-host

  eegfaktura-postgresql:
    ports: !override
      - "127.0.0.1:26432:5432"

  eegfaktura-eda:
    profiles: ["full"]
  eegfaktura-billing:
    profiles: ["full"]
  eegfaktura-postfix:
    profiles: ["full"]
