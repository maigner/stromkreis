# Stromkreis-Testinstanz von EEG-Faktura auf "server" (docs/eegfaktura-lokal.md).
# Wird von docker compose automatisch zusaetzlich zu docker-compose.yaml geladen;
# die Upstream-Datei bleibt unveraendert und per Tarball aktualisierbar.
#
# Abweichungen vom Upstream-Stack:
# - Healthcheck: /health/ready liegt bei Keycloak 26 auf dem Management-Port 9181.
# - Oeffentliche Hostnamen hinter dem Server-Caddy (TLS, ~/Container/caddy/Caddyfile):
#     https://eegfaktura-test.stromkreis.net        -> 127.0.0.1:8001 (SPA + /api + /energystore)
#     https://admin.eegfaktura-test.stromkreis.net  -> 127.0.0.1:8002 (Admin-Portal)
#     https://auth.eegfaktura-test.stromkreis.net   -> 127.0.0.1:8180 (Keycloak; Konsole nur Heimnetz)
#   Die Container erreichen die Hostnamen per extra_hosts host-gateway (Caddy lauscht
#   im Host-Netz auf 443), Token-iss == JWKS-URL, gueltiges Let's-Encrypt-Zertifikat.
# - Port 8080 ist am Server durch Nextcloud AIO belegt: Keycloak laeuft auf 8180.
#   Alle Ports nur auf 127.0.0.1, nach aussen geht es ausschliesslich ueber Caddy.
# - eda, billing, postfix laufen nicht (Profil "full"): keine Netzbetreiber-
#   Anbindung, Abrechnung ausserhalb des Stromkreis-Scopes.
# - restart: unless-stopped fuer alle Dienste. Upstream setzt keine Restart-Policy;
#   nach dem Server-Neustart am 24.8. blieb der ganze Stack liegen.

x-kc-host: &kc-host
  restart: unless-stopped
  extra_hosts:
    - "eegfaktura-test.stromkreis.net:host-gateway"
    - "admin.eegfaktura-test.stromkreis.net:host-gateway"
    - "auth.eegfaktura-test.stromkreis.net:host-gateway"

services:
  eegfaktura-keycloak:
    <<: *kc-host
    environment:
      KC_HTTP_PORT: "8180"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME: "https://auth.eegfaktura-test.stromkreis.net"
      KEYCLOAK_FRONTEND_URL: "https://auth.eegfaktura-test.stromkreis.net"
      # Bootstrap-Admin nur beim ersten Start einer leeren DB; Upstream-Default
      # "SuperSecretPassword" ist fuer einen aus dem Internet erreichbaren Keycloak tabu.
      KEYCLOAK_ADMIN_PASSWORD: "${KC_ADMIN_PW:?KC_ADMIN_PW fehlt in .env}"
    ports: !override
      - "127.0.0.1:8180:8180"
      - "127.0.0.1:9181:9181"
    healthcheck:
      test: [
        "CMD-SHELL",
        "exec 3<>/dev/tcp/localhost/9181; echo -en 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; if timeout 3 cat <&3 | grep -m 1 'UP'; then exec 3<&-; exec 3>&-; exit 0; else exec 3<&-; exec 3>&-; exit 1; fi"
      ]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 40

  eegfaktura-web:
    <<: *kc-host
    environment:
      KEYCLOAK_URL: "https://auth.eegfaktura-test.stromkreis.net"

  eegfaktura-admin-web:
    <<: *kc-host
    environment:
      KEYCLOAK_URL: "https://auth.eegfaktura-test.stromkreis.net"

  eegfaktura-admin-backend:
    <<: *kc-host
    environment:
      KEYCLOAK_URL: "https://auth.eegfaktura-test.stromkreis.net"
      # Admin-API-Zugang fuer das Anlegen der EEG-Admin-Benutzer. Das Image liest
      # NICHT keycloak.json (KEYCLOAK_CONFIG_JSON ist in application.conf auskommentiert),
      # sondern diese Variable; ohne sie gilt ein eingebautes Default-Secret -> 401
      # (Upstream-Issue #27). Wert kommt aus .env (Symlink auf secrets.env).
      KEYCLOAK_ADMIN_CLI_SECRET: "${ADMIN_CLI_SECRET:?ADMIN_CLI_SECRET fehlt in .env}"

  eegfaktura-backend:
    <<: *kc-host
    # Das Registry-Image ghcr.io/eegfaktura/vfeeg-backend:latest stammt vom 30.5.2026
    # und beantwortet authentifizierte Anfragen (GET /eeg, Stammdaten-Upload) mit
    # 200 ohne Body und ohne Wirkung. Deshalb aus dem aktuellen master gebaut:
    # build/build-backend.sh (Quelle als Tarball, docker build -t vfeeg-backend:local).
    image: vfeeg-backend:local

  eegfaktura-energystore:
    <<: *kc-host
    environment:
      # Upstream setzt "ENERGYSTORE_SERVICES_master-server" (kleingeschrieben); viper
      # sucht die GROSSGESCHRIEBENE Variable, findet sie nicht und waehlt localhost:9092.
      # Folge: rawdata ohne "cps" scheitert mit "error fetch Meteringpoints".
      ENERGYSTORE_SERVICES_MASTER-SERVER: "eegfaktura-backend:9092"

  eegfaktura-filestore:
    <<: *kc-host

  eegfaktura-postgresql:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:26432:5432"

  eegfaktura-mosquitto:
    restart: unless-stopped

  eegfaktura-proxy:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8001:80"
      - "127.0.0.1:8002:81"

  eegfaktura-eda:
    profiles: ["full"]
  eegfaktura-billing:
    profiles: ["full"]
  eegfaktura-postfix:
    profiles: ["full"]
