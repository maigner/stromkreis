version: 1
# ============================================================================
# Stromkreis - Seiten fuer die Main UI
#
# Gebaut fuer das Smartphone (openHAB-App): alles einspaltig, kurze Listen
# statt nebeneinander gequetschter Karten. Die Seite "overview" zeigt oben
# eine Hero-Karte mit Ladestand-Anzeige, Batterieleistung und Stromkreis-Status,
# darunter die Tageszeiten der Gemeinschaft, den Hauptschalter und die
# Navigation zu vier Unterseiten (Laden, Einspeisen, Pause, Experten). Jede
# Navigationszeile traegt ein Badge mit dem aktuellen Zustand, so sieht man
# ohne Tippen, was eingeschaltet ist.
#
# Aufbau-Konventionen (gelten fuer alle Seiten):
#   - oh-list-card mit oh-*-item statt einzelner Karten je Wert: kompakt,
#     und die Erklaerung steht einmal als Karten-Footer.
#   - mediaList: true, wo Zeilen einen Untertitel (Kurzerklaerung) haben.
#   - Ein- und Ausschalter sind oh-toggle-item, Zahlen-Einstellungen
#     oh-stepper-item; Untertitel und Badges haengen per Expression am
#     Item-Zustand.
#   - Die Hero-Karte ist eine oh-card mit eigenem Stylesheet (scoped); sie
#     nutzt oh-gauge fuer den Ladestand und einfache div-Komponenten fuer
#     die Werte. Batterieleistung: positiv = entladen, negativ = laden
#     (Adapter-Kontrakt, siehe control/core.js).
#
# Wird von setup/05-install-overview.sh per REST API installiert; dafuer
# wandelt build-dist.sh jede Seite unter `pages:` nach page-<uid>.json.
# Die Platzhalter-Items aus profile.sh (INVERTER_SOC_PLACEHOLDER und
# INVERTER_BATTERY_POWER_PLACEHOLDER) werden dabei durch das SOC_ITEM bzw.
# BATTERY_POWER_ITEM der Anlage ersetzt.
#
# Manuell einspielen geht weiterhin: je Eintrag unter `pages:` eine Seite in
# der Main UI anlegen (Settings -> Pages) und den Inhalt in der Code-Ansicht
# einfuegen; die Seite "overview" ersetzt die vorhandene Overview.
#
# Profil deye: abgeleitet von fronius/overview.yaml - gleiche Seiten, nur die
# Item-Namen des Wechselrichters sind andere,
# und die Hero-Karte zeigt keine Netzeinspeisung (kein Netzleistungs-Item).
# Aenderungen bitte in allen Profilen nachziehen.
# ============================================================================
pages:
  # --- Home-Konfiguration: nur der Overview-Tab ------------------------------
  # Blendet die Modell-Tabs (Standorte, Geraete, Eigenschaften) aus - sie
  # sind fuer Mitglieder nur verwirrend. Damit verschwindet auch die
  # Tab-Leiste und die Overview fuellt den ganzen Bildschirm.
  home:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-home-page
    config:
      # Ohne label bricht in der Main UI (5.0) die Seitenliste der Sidebar
      # mit einem Fehler ab - deshalb immer ein Label setzen.
      label: Home
      hiddenModelTabs:
        - locations
        - equipment
        - properties

  # --- Startseite: Hero, Tageszeiten, Hauptschalter, Navigation --------------
  overview:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Stromkreis Batterie
    slots:
      default:
        # Begruessung unter dem eingebauten Navbar-Titel "Uebersicht":
        # HALLOSKGREETING ersetzt 05-install-overview.sh durch
        # "Hallo <Vorname>"; ohne Vornamen bleibt die Zeile leer.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: f7-col
                config: {}
                slots:
                  default:
                    - component: div
                      config:
                        class: sk-page-head
                        stylesheet: >
                          .sk-page-head { padding: 0 16px; font-size: 22px; font-weight: 600; line-height: 1.3; }
                        content: HALLOSKGREETING
        # Hero-Karte: Ladestand als Halbkreis-Anzeige, daneben die aktuelle
        # Batterieleistung, unten der Stromkreis-Status.
        # Tippen oeffnet den Verlauf von Ladestand und Batterieleistung.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-card
                            config:
                              noBorder: true
                              style:
                                background: "linear-gradient(135deg, #1d4716 0%, #3f8a26 55%, #63b53b 100%)"
                                color: "#ffffff"
                                border-radius: 18px
                                box-shadow: 0 8px 24px rgba(29, 71, 22, 0.35)
                              contentStyle:
                                padding: 18px 18px 14px 18px
                              action: analyzer
                              actionAnalyzerItems:
                                - Stromkreis_DY_SoC
                                - Stromkreis_DY_BatteryPower
                              actionAnalyzerCoordSystem: time
                              stylesheet: >
                                .sk-hero-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
                                .sk-hero-brand { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; font-weight: 600; }
                                .sk-hero-title { font-size: 13px; opacity: 0.85; }
                                .sk-hero-row { display: flex; align-items: center; gap: 14px; }
                                .sk-hero-gauge { flex: 0 0 auto; margin-top: 4px; }
                                .sk-hero-stats { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
                                .sk-stat { background: rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 8px 12px; }
                                .sk-stat-label { font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                                .sk-stat-value { font-size: 20px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
                                .sk-hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
                                .sk-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); font-size: 13px; font-weight: 600; white-space: nowrap; }
                                .sk-pill-dot { width: 8px; height: 8px; border-radius: 50%; background: #d9f5c9; box-shadow: 0 0 0 3px rgba(217, 245, 201, 0.25); }
                                .sk-pill-dot.off { background: #c8c8c8; box-shadow: none; }
                                .sk-pill-dot.pause { background: #ffc857; box-shadow: 0 0 0 3px rgba(255, 200, 87, 0.25); }
                                .sk-hero-hint { font-size: 11px; opacity: 0.7; text-align: right; }
                            slots:
                              content:
                                - component: div
                                  config:
                                    class: [sk-hero-head]
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: [sk-hero-brand]
                                          content: Stromkreis
                                      - component: div
                                        config:
                                          class: [sk-hero-title]
                                          content: Speichermanagement
                                - component: div
                                  config:
                                    class: [sk-hero-row]
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: [sk-hero-gauge]
                                        slots:
                                          default:
                                            - component: oh-gauge
                                              config:
                                                # Kein item, sondern value per Expression: bei NULL
                                                # zeigt die Gauge sonst einen vollen Bogen.
                                                value: "=Number.isNaN(Number.parseFloat(items.Stromkreis_DY_SoC.state)) ? '0' : items.Stromkreis_DY_SoC.state"
                                                type: semicircle
                                                size: 150
                                                borderWidth: 14
                                                borderColor: "#d9f5c9"
                                                borderBgColor: rgba(255, 255, 255, 0.22)
                                                valueText: "=Number.isNaN(Number.parseFloat(items.Stromkreis_DY_SoC.state)) ? '-' : Math.round(Number.parseFloat(items.Stromkreis_DY_SoC.state)) + '%'"
                                                valueTextColor: "#ffffff"
                                                valueFontSize: 30
                                                valueFontWeight: "700"
                                                labelText: Ladestand
                                                labelTextColor: rgba(255, 255, 255, 0.8)
                                                labelFontSize: 12
                                      - component: div
                                        config:
                                          class: [sk-hero-stats]
                                        slots:
                                          default:
                                            # BEGIN batterie-stat (entfaellt ohne Batterieleistungs-Item)
                                            - component: div
                                              config:
                                                class: [sk-stat]
                                              slots:
                                                default:
                                                  - component: div
                                                    config:
                                                      class: [sk-stat-label]
                                                      content: "=Number.isNaN(Number.parseFloat(items.Stromkreis_DY_BatteryPower.state)) ? 'Batterie' : (Number.parseFloat(items.Stromkreis_DY_BatteryPower.state) < -20 ? 'Batterie lädt' : (Number.parseFloat(items.Stromkreis_DY_BatteryPower.state) > 20 ? 'Batterie entlädt' : 'Batterie ruht'))"
                                                  - component: div
                                                    config:
                                                      class: [sk-stat-value]
                                                      content: "=Number.isNaN(Number.parseFloat(items.Stromkreis_DY_BatteryPower.state)) ? '-' : (Math.abs(Number.parseFloat(items.Stromkreis_DY_BatteryPower.state)) >= 1000 ? (Math.round(Math.abs(Number.parseFloat(items.Stromkreis_DY_BatteryPower.state)) / 100) / 10).toFixed(1).replace('.', ',') + ' kW' : Math.round(Math.abs(Number.parseFloat(items.Stromkreis_DY_BatteryPower.state))) + ' W')"
                                            # END batterie-stat
                                - component: div
                                  config:
                                    class: [sk-hero-foot]
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: [sk-pill]
                                        slots:
                                          default:
                                            - component: div
                                              config:
                                                class: "=items.Stromkreis_Aktiv.state === 'ON' ? (Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? ['sk-pill-dot', 'pause'] : ['sk-pill-dot']) : ['sk-pill-dot', 'off']"
                                            - component: div
                                              config:
                                                content: "=items.Stromkreis_Aktiv.state === 'ON' ? (Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'Pausiert, noch ' + items.Stromkreis_PAUSE_TAGE.state + (Number(items.Stromkreis_PAUSE_TAGE.state) == 1 ? ' Tag' : ' Tage') : 'Speichermanagement aktiv') : (items.Stromkreis_Aktiv.state === 'OFF' ? 'Speichermanagement aus' : 'Zustand unbekannt')"
                                      - component: div
                                        config:
                                          class: [sk-hero-hint]
                                          content: Tippen zeigt den Verlauf

        # Tageszeiten der Gemeinschaft: wann geladen und wann eingespeist wird.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Heute in der Gemeinschaft
                              footer: >-
                                Zwischen diesen Zeiten erzeugt die Gemeinschaft
                                mehr Strom, als sie verbraucht - dann lädt die
                                Batterie aus der eigenen PV. Danach speist sie
                                ein; der Eigenbedarf des Hauses bis zum nächsten
                                Überschuss bleibt im Speicher.
                            slots:
                              default:
                                - component: oh-label-item
                                  config:
                                    title: Überschuss ab
                                    icon: f7:sunrise_fill
                                    iconColor: orange
                                    item: Stromkreis_Crossover_Start
                                - component: oh-label-item
                                  config:
                                    title: Überschuss bis
                                    icon: f7:sunset_fill
                                    iconColor: deeporange
                                    item: Stromkreis_Crossover_Ende

        # Hauptschalter und Navigation zu den Unterseiten; Badges zeigen den
        # Zustand der Funktionen, ohne dass man die Seite oeffnen muss.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Steuerung
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Speichermanagement
                                    subtitle: "=items.Stromkreis_Aktiv.state === 'ON' ? 'Steuert die Batterie automatisch' : (items.Stromkreis_Aktiv.state === 'OFF' ? 'Aus, Wechselrichter wie ab Werk' : 'Zustand noch unbekannt')"
                                    icon: f7:power
                                    iconColor: "=items.Stromkreis_Aktiv.state === 'ON' ? 'green' : 'gray'"
                                    item: Stromkreis_Aktiv
                                    color: green
                                - component: oh-list-item
                                  config:
                                    title: Laden bei Sonnenprognose
                                    subtitle: Lädt gebremst, abends trotzdem voll
                                    icon: f7:sun_max_fill
                                    iconColor: orange
                                    badge: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'Ein' : 'Aus'"
                                    badgeColor: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'green' : 'gray'"
                                    action: navigate
                                    actionPage: page:stromkreis_laden
                                - component: oh-list-item
                                  config:
                                    title: Einspeisen am Abend
                                    subtitle: Versorgt abends die Gemeinschaft
                                    icon: f7:moon_stars_fill
                                    iconColor: deeppurple
                                    badge: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'Ein' : 'Aus'"
                                    badgeColor: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'green' : 'gray'"
                                    action: navigate
                                    actionPage: page:stromkreis_einspeisen
                                - component: oh-list-item
                                  config:
                                    title: Pause
                                    subtitle: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'Pause läuft, Batterie wie ab Werk' : 'Bei Urlaub oder Wartung aussetzen'"
                                    icon: f7:pause_circle_fill
                                    iconColor: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'orange' : 'gray'"
                                    badge: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'noch ' + items.Stromkreis_PAUSE_TAGE.state + (Number(items.Stromkreis_PAUSE_TAGE.state) == 1 ? ' Tag' : ' Tage') : ''"
                                    badgeColor: orange
                                    action: navigate
                                    actionPage: page:stromkreis_pause
                                - component: oh-list-item
                                  config:
                                    title: Für Experten
                                    subtitle: Entladeleistung, Netzladeschutz, Notfallplan
                                    icon: f7:wrench_fill
                                    iconColor: gray
                                    action: navigate
                                    actionPage: page:stromkreis_experten

        # Erklaerung, aufklappbar - stoert nicht, ist aber da.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              accordionList: true
                            slots:
                              default:
                                - component: oh-list-item
                                  config:
                                    title: Wie funktioniert die Steuerung?
                                    icon: f7:info_circle_fill
                                    iconColor: blue
                                  slots:
                                    accordion:
                                      - component: f7-block
                                        config:
                                          style:
                                            margin: 0
                                            padding: 0 16px 16px 16px
                                        slots:
                                          default:
                                            - component: Label
                                              config:
                                                text: >-
                                                  Das Speichermanagement steuert die Batterie
                                                  so, dass möglichst viel Sonnenstrom in der
                                                  Energiegemeinschaft bleibt. Geladen wird ausschließlich aus der
                                                  eigenen PV-Anlage, nie aus dem Netz. Es
                                                  bestimmt nur, WANN das passiert: tagsüber
                                                  lädt die Batterie gerade so schnell, dass sie
                                                  abends voll ist, und der restliche
                                                  Sonnenstrom geht laufend an Haushalt und
                                                  Gemeinschaft. Am Abend speist die Batterie
                                                  ein, solange die Gemeinschaft mehr verbraucht
                                                  als erzeugt. Alle Prognosen kommen
                                                  automatisch von stromkreis.net.
                                                style:
                                                  white-space: normal
                                                  line-height: 1.5
                                                  font-size: 14px

  # --- Unterseite: Laden bei Sonnenprognose ----------------------------------
  stromkreis_laden:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Laden bei Sonnenprognose
    slots:
      default:
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                              footer: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'Die Batterie lädt an sonnigen Tagen automatisch gerade schnell genug, um am Abend voll zu sein. Der restliche Sonnenstrom geht laufend an Haushalt und Gemeinschaft. An trüben Tagen lädt die Batterie ungebremst.' : (items.Stromkreis_LADESPERRE_AKTIV.state === 'OFF' ? 'Die Batterie lädt aus der eigenen PV, sobald Sonne da ist.' : 'Zustand noch unbekannt - openHAB startet vermutlich gerade.')"
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Intelligentes Laden
                                    subtitle: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'Eingeschaltet' : 'Ausgeschaltet'"
                                    icon: f7:sun_max_fill
                                    iconColor: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'orange' : 'gray'"
                                    item: Stromkreis_LADESPERRE_AKTIV
                                    color: green
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Aktuelle Regelung
                              footer: >-
                                Ziel-Ladeleistung: mit dieser Leistung soll die
                                Batterie gerade laden, damit sie am Abend voll
                                ist; "-" heißt keine Begrenzung, die Batterie
                                lädt frei. Restladezeit: sonnengewichtete
                                Ladezeit bis zum Abend - jede Stunde zählt nur
                                mit ihrem erwarteten Ertrag laut Prognose; "-"
                                heißt gerade nicht berechenbar.
                            slots:
                              default:
                                - component: oh-label-item
                                  config:
                                    title: Ziel-Ladeleistung
                                    icon: f7:bolt_fill
                                    iconColor: orange
                                    item: Stromkreis_LADEREGELUNG_SOLL
                                - component: oh-label-item
                                  config:
                                    title: Effektive Restladezeit
                                    icon: f7:timer
                                    iconColor: blue
                                    item: Stromkreis_RESTLADEZEIT

  # --- Unterseite: Einspeisen am Abend ---------------------------------------
  stromkreis_einspeisen:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Einspeisen am Abend
    slots:
      default:
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                              footer: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'Die Batterie speist am Abend ins Netz ein, solange die Gemeinschaft mehr verbraucht als erzeugt (Einspeise-Zeiten unten). Liegen keine Einspeise-Zeiten vor, wird nicht eingespeist.' : (items.Stromkreis_ENTLADUNG_AKTIV.state === 'OFF' ? 'Es wird nicht automatisch eingespeist.' : 'Zustand noch unbekannt - openHAB startet vermutlich gerade.')"
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Entladung verwenden
                                    subtitle: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'Eingeschaltet' : 'Ausgeschaltet'"
                                    icon: f7:moon_stars_fill
                                    iconColor: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'deeppurple' : 'gray'"
                                    item: Stromkreis_ENTLADUNG_AKTIV
                                    color: green
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Heute Nacht
                              footer: >-
                                Eingespeist wird, sobald die Gemeinschaft am
                                Abend laut Prognose im Defizit ist (ohne
                                tagesaktuelle Zeit: eine Stunde nach dem
                                Abend-Crossover), bis die Gemeinschaft am
                                Morgen wieder mehr erzeugt als verbraucht.
                                Hauslast: nächtlicher Verbrauch des Hauses,
                                gelernt aus dem Ladestandsabfall ohne
                                Einspeisung.
                            slots:
                              default:
                                - component: oh-label-item
                                  config:
                                    title: Einspeisung ab
                                    icon: f7:sunset_fill
                                    iconColor: deeporange
                                    item: Stromkreis_Entladestart
                                    after: "=(items.Stromkreis_Entladestart.state && items.Stromkreis_Entladestart.state !== '-' && items.Stromkreis_Entladestart.state !== 'NULL' && items.Stromkreis_Entladestart.state !== 'UNDEF') ? items.Stromkreis_Entladestart.state : items.Stromkreis_Crossover_Ende.state"
                                - component: oh-label-item
                                  config:
                                    title: Einspeisung bis
                                    icon: f7:sunrise_fill
                                    iconColor: orange
                                    item: Stromkreis_Crossover_Start
                                - component: oh-label-item
                                  config:
                                    title: Geschätzte Hauslast
                                    icon: f7:house_fill
                                    iconColor: teal
                                    item: Stromkreis_HAUSLAST
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Reserve
                              footer: >-
                                Unter diesem Ladestand stoppt die Einspeisung -
                                diese Reserve bleibt für den eigenen Haushalt.
                            slots:
                              default:
                                - component: oh-stepper-item
                                  config:
                                    title: Reserve-Ladestand (%)
                                    icon: f7:battery_25
                                    iconColor: green
                                    item: Stromkreis_MIN_BATTERY_CHARGE
                                    min: 10
                                    max: 90
                                    step: 5

  # --- Unterseite: Stromkreis pausieren ---------------------------------------------
  stromkreis_pause:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Pause
    slots:
      default:
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                              footer: >-
                                Praktisch bei Urlaub, Wartung oder wenn der
                                Strom gerade selbst gebraucht wird: Solange die
                                Pause läuft, greift das Speichermanagement
                                nicht ein - der Wechselrichter arbeitet wie ab
                                Werk, alle Einstellungen bleiben erhalten. Jede
                                Nacht zählt die Pause um einen Tag herunter;
                                danach arbeitet es von selbst weiter.
                            slots:
                              default:
                                - component: oh-list-item
                                  config:
                                    title: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'Pause läuft' : 'Keine Pause'"
                                    subtitle: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'Batterie wie ab Werk, noch ' + items.Stromkreis_PAUSE_TAGE.state + (Number(items.Stromkreis_PAUSE_TAGE.state) == 1 ? ' Tag' : ' Tage') : 'Speichermanagement arbeitet normal'"
                                    icon: f7:pause_circle_fill
                                    iconColor: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'orange' : 'gray'"
                                - component: oh-stepper-item
                                  config:
                                    title: Verbleibende Tage
                                    icon: f7:calendar
                                    iconColor: blue
                                    item: Stromkreis_PAUSE_TAGE
                                    min: 0
                                    max: 14
                                    step: 1
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config:
                        width: "50"
                      slots:
                        default:
                          - component: oh-card
                            config: {}
                            slots:
                              content:
                                - component: oh-button
                                  config:
                                    text: 3 Tage
                                    iconF7: pause_fill
                                    iconSize: 18
                                    action: command
                                    actionItem: Stromkreis_PAUSE_TAGE
                                    actionCommand: "3"
                                    fill: true
                                    large: true
                                    color: orange
                    - component: oh-grid-col
                      config:
                        width: "50"
                      slots:
                        default:
                          - component: oh-card
                            config: {}
                            slots:
                              content:
                                - component: oh-button
                                  config:
                                    text: 5 Tage
                                    iconF7: pause_fill
                                    iconSize: 18
                                    action: command
                                    actionItem: Stromkreis_PAUSE_TAGE
                                    actionCommand: "5"
                                    fill: true
                                    large: true
                                    color: orange
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-card
                            config: {}
                            slots:
                              content:
                                - component: oh-button
                                  config:
                                    text: Pause beenden
                                    iconF7: play_fill
                                    iconSize: 18
                                    action: command
                                    actionItem: Stromkreis_PAUSE_TAGE
                                    actionCommand: "0"
                                    fill: true
                                    large: true
                                    color: green

  # --- Unterseite: Fuer Experten ---------------------------------------------
  stromkreis_experten:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Für Experten
    slots:
      default:
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Entladeleistung
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                              footer: >-
                                Automatisch: passt die Einspeiseleistung an die
                                geschätzte Batteriegröße an - die wird während
                                der nächtlichen Einspeisung aus der
                                Ladestandsänderung geschätzt und mit jeder
                                Nacht genauer. Solange keine Schätzung
                                vorliegt (oder bei AUS) gelten Minimum und
                                Maximum: das Minimum wird auch bei veralteter
                                Wolkenvorschau eingespeist, das Maximum ist
                                die Obergrenze fürs Einspeisen; die Vorgabe
                                passt für die meisten Anlagen.
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Automatische Entladeleistung
                                    subtitle: An die geschätzte Batteriegröße anpassen
                                    icon: f7:speedometer
                                    iconColor: "=items.Stromkreis_DYNAMISCHE_LEISTUNG.state === 'ON' ? 'blue' : 'gray'"
                                    item: Stromkreis_DYNAMISCHE_LEISTUNG
                                    color: blue
                                - component: oh-label-item
                                  config:
                                    title: Geschätzte Batteriegröße
                                    subtitle: Aus der nächtlichen Entladung gelernt
                                    icon: f7:battery_100
                                    iconColor: green
                                    item: Stromkreis_BATTERIE_KAPAZITAET
                                - component: oh-stepper-item
                                  config:
                                    title: Minimum (W)
                                    icon: f7:arrow_down_to_line
                                    iconColor: gray
                                    item: Minimale_Entladeleistung_Batterieeinspeisung
                                    min: 0
                                    max: 1000
                                    step: 100
                                - component: oh-stepper-item
                                  config:
                                    title: Maximum (W)
                                    icon: f7:arrow_up_to_line
                                    iconColor: gray
                                    item: Maximale_Entladeleistung_Batterieeinspeisung
                                    min: 1000
                                    max: 4000
                                    step: 500
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Netzladeschutz
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                              footer: >-
                                Grundsatz der Gemeinschaft: die Batterie lädt
                                nur aus der eigenen PV, nie aus dem Netz.
                                Erkennt das Speichermanagement 15 Minuten
                                lang, dass die Batterie netto aus dem Netz lädt (z. B. durch einen
                                Zeitplan am Wechselrichter), sperrt es das
                                Laden. Schutzladungen bei fast leerer Batterie
                                werden nie blockiert. Die Ladung aus dem Netz
                                sollte immer 0 W sein; dauerhaft höhere Werte
                                zeigen einen Zeitplan oder eine
                                Fehlkonfiguration am Wechselrichter.
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Netzladeschutz
                                    subtitle: Nur aus der eigenen PV laden
                                    icon: f7:shield_fill
                                    iconColor: "=items.Stromkreis_NETZLADESCHUTZ.state === 'ON' ? 'green' : 'gray'"
                                    item: Stromkreis_NETZLADESCHUTZ
                                    color: green
                                - component: oh-label-item
                                  config:
                                    title: Ladung aus dem Netz
                                    subtitle: Sollte 0 W sein
                                    icon: f7:arrow_down_circle
                                    iconColor: red
                                    item: Stromkreis_NETZLADUNG
        - component: oh-block
          config:
            title: Notfallplan Laden (Sperrfenster)
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                              footer: >-
                                Kern des intelligenten Ladens ist die
                                dynamische Regelung: statt einer harten Sperre
                                lädt die Batterie den ganzen Tag gerade
                                schnell genug, um am Abend voll zu sein. Nur
                                ausschalten, wenn die Regelung Probleme macht -
                                dann gilt das klassische Sperrfenster unten als
                                Notfallplan; bei fehlenden Schätz- oder
                                Prognosedaten springt es automatisch ein. Mit
                                "Sperr-Ende individuell" wird das Sperr-Ende
                                dann für diese Anlage berechnet -
                                aus Batteriegröße, gelernter Ladeleistung und
                                dem Sonnenverlauf des Tages, so spät wie
                                möglich, aber die Batterie ist am Abend voll.
                                Solange die Schätzungen fehlen (oder bei AUS),
                                gilt das allgemeine Ende laut Tagesprognose.
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Ladeleistung dynamisch regeln
                                    subtitle: Empfohlen, nur im Problemfall aus
                                    icon: f7:slider_horizontal_3
                                    iconColor: "=items.Stromkreis_LADEREGELUNG.state === 'ON' ? 'blue' : 'gray'"
                                    item: Stromkreis_LADEREGELUNG
                                    color: blue
                                - component: oh-toggle-item
                                  config:
                                    title: Sperr-Ende individuell
                                    subtitle: An die Anlage angepasst, nur als Rückfall
                                    icon: f7:scope
                                    iconColor: "=items.Stromkreis_LADESPERRE_LOKAL.state === 'ON' ? 'blue' : 'gray'"
                                    item: Stromkreis_LADESPERRE_LOKAL
                                    color: blue
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Sperrfenster heute
                              footer: >-
                                Sperre ab: erster Sonnenschein laut
                                Tagesprognose, kommt automatisch von
                                stromkreis.net; "-" heißt heute keine Sperre.
                                Sperre bis: individuell für diese Anlage
                                berechnet, sofern eingeschaltet und Schätzwerte
                                vorliegen, sonst laut Tagesprognose der
                                Gemeinschaft; ab dem Ende lädt die Batterie aus
                                der eigenen PV. Notfall-Ende: greift nur, wenn
                                stromkreis.net kein individuelles Ende liefert;
                                "-" heißt, das Ende unter "Sperre bis" gilt
                                oder es wird heute nicht gesperrt.
                                Ladeleistung: aus dem Anstieg des Ladestands an
                                sonnigen Tagen gelernt, bestimmt zusammen mit
                                der Batteriegröße das selbst berechnete
                                Sperr-Ende.
                            slots:
                              default:
                                - component: oh-label-item
                                  config:
                                    title: Sperre ab
                                    icon: f7:sunrise
                                    iconColor: orange
                                    item: Stromkreis_Ladesperre_Start
                                - component: oh-label-item
                                  config:
                                    title: Sperre bis
                                    icon: f7:sun_max
                                    iconColor: orange
                                    item: Stromkreis_Ladesperre_Ende
                                - component: oh-label-item
                                  config:
                                    title: Notfall-Ende (lokal gerechnet)
                                    icon: f7:exclamationmark_triangle
                                    iconColor: gray
                                    item: Stromkreis_LADESPERRE_LOKAL_ENDE
                                - component: oh-label-item
                                  config:
                                    title: Geschätzte Ladeleistung
                                    icon: f7:bolt
                                    iconColor: gray
                                    item: Stromkreis_LADELEISTUNG
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Bewölkung
                              footer: >-
                                Vorhersage für den Vormittag in Prozent: 0% =
                                wolkenlos, 100% = bedeckt, kommt stündlich von
                                stromkreis.net. Nur wenn die Bewölkung unter
                                der Schwelle liegt (also genug Sonne kommt),
                                wird das Laden geregelt oder gesperrt. Darüber
                                lädt die Batterie immer frei.
                            slots:
                              default:
                                - component: oh-label-item
                                  config:
                                    title: Bewölkung am Vormittag
                                    icon: f7:cloud_sun_fill
                                    iconColor: lightblue
                                    item: Stromkreis_Wolkenvorschau
                                - component: oh-stepper-item
                                  config:
                                    title: Schwelle (%)
                                    icon: f7:cloud_fill
                                    iconColor: gray
                                    item: Stromkreis_LADESPERRE_WOLKEN_SCHWELLE
                                    min: 0
                                    max: 100
                                    step: 5
