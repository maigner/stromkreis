version: 1
# ============================================================================
# Stromkreis - Seiten fuer die Main UI
#
# Gebaut fuer das Smartphone (openHAB-App): alles einspaltig, kurze Listen
# statt nebeneinander gequetschter Karten. Die Seite "overview" zeigt oben
# eine Hero-Karte mit Ladestand-Anzeige, Batterieleistung und Stromkreis-Status,
# darunter die Tageszeiten der Gemeinschaft, den Hauptschalter und die
# Navigation zu drei Unterseiten (Laden, Einspeisen, Pause). Jede
# Navigationszeile traegt ein Badge mit dem aktuellen Zustand, so sieht man
# ohne Tippen, was eingeschaltet ist.
#
# Aufbau-Konventionen (gelten fuer alle Seiten):
#   - oh-list-card mit oh-*-item statt einzelner Karten je Wert: kompakt,
#     und die Erklaerung steht einmal als Karten-Footer.
#   - mediaList: true, wo Zeilen einen Untertitel (Kurzerklaerung) haben.
#   - Ein- und Ausschalter sind oh-toggle-item, Zahlen-Einstellungen
#     oh-stepper-item; Untertitel und Badges haengen per Expression am
#     Item-Zustand.
#   - Die Hero-Karte ist eine oh-card mit eigenem Stylesheet (scoped); sie
#     nutzt oh-gauge fuer den Ladestand und einfache div-Komponenten fuer
#     die Werte. Batterieleistung: positiv = entladen, negativ = laden
#     (Adapter-Kontrakt, siehe control/core.js).
#
# Wird von setup/05-install-overview.sh per REST API installiert; dafuer
# wandelt build-dist.sh jede Seite unter `pages:` nach page-<uid>.json.
# Die Platzhalter-Items aus profile.sh (INVERTER_SOC_PLACEHOLDER und
# INVERTER_BATTERY_POWER_PLACEHOLDER) werden dabei durch das SOC_ITEM bzw.
# BATTERY_POWER_ITEM der Anlage ersetzt.
#
# Manuell einspielen geht weiterhin: je Eintrag unter `pages:` eine Seite in
# der Main UI anlegen (Settings -> Pages) und den Inhalt in der Code-Ansicht
# einfuegen; die Seite "overview" ersetzt die vorhandene Overview.
#
# Die anderen Profile (deye, sigenergy, victron, fronius-snapinverter)
# unterscheiden sich nur in den Item-Namen des Wechselrichters und darin,
# welche Werte die Hero-Karte zeigt (Netzeinspeisung nur mit Netzleistungs-
# Item, Batterieleistung nur mit Batterieleistungs-Item). Aenderungen hier
# bitte in alle Profile uebernehmen.
# ============================================================================
pages:
  # --- Home-Konfiguration: nur der Overview-Tab ------------------------------
  # Blendet die Modell-Tabs (Standorte, Geraete, Eigenschaften) aus - sie
  # sind fuer Mitglieder nur verwirrend. Damit verschwindet auch die
  # Tab-Leiste und die Overview fuellt den ganzen Bildschirm.
  home:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-home-page
    config:
      # Ohne label bricht in der Main UI (5.0) die Seitenliste der Sidebar
      # mit einem Fehler ab - deshalb immer ein Label setzen.
      label: Home
      hiddenModelTabs:
        - locations
        - equipment
        - properties

  # --- Startseite: Hero, Tageszeiten, Hauptschalter, Navigation --------------
  overview:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Stromkreis Batterie
    slots:
      default:
        # Begruessung unter dem eingebauten Navbar-Titel "Uebersicht":
        # HALLOSKGREETING ersetzt 05-install-overview.sh durch
        # "Hallo <Vorname>"; ohne Vornamen bleibt die Zeile leer.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: f7-col
                config: {}
                slots:
                  default:
                    - component: div
                      config:
                        class: sk-page-head
                        stylesheet: >
                          .sk-page-head { padding: 0 16px; font-size: 22px; font-weight: 600; line-height: 1.3; }
                        content: HALLOSKGREETING
        # Hero-Karte: Ladestand als Halbkreis-Anzeige, daneben die aktuelle
        # Batterieleistung und die Netzeinspeisung, unten der Stromkreis-Status.
        # Tippen oeffnet den Verlauf von Ladestand und Batterieleistung.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-card
                            config:
                              noBorder: true
                              style:
                                background: "linear-gradient(135deg, #1d4716 0%, #3f8a26 55%, #63b53b 100%)"
                                color: "#ffffff"
                                border-radius: 18px
                                box-shadow: 0 8px 24px rgba(29, 71, 22, 0.35)
                              contentStyle:
                                padding: 18px 18px 14px 18px
                              action: analyzer
                              actionAnalyzerItems:
                                - Fronius_Symo_Inverter_Battery_State_of_Charge
                                - Fronius_Symo_Inverter_Battery_Power
                              actionAnalyzerCoordSystem: time
                              stylesheet: >
                                .sk-hero-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
                                .sk-hero-brand { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; font-weight: 600; }
                                .sk-hero-title { font-size: 13px; opacity: 0.85; }
                                .sk-hero-row { display: flex; align-items: center; gap: 14px; }
                                .sk-hero-gauge { flex: 0 0 auto; margin-top: 4px; }
                                .sk-hero-stats { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
                                .sk-stat { background: rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 8px 12px; }
                                .sk-stat-label { font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                                .sk-stat-value { font-size: 20px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
                                .sk-hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
                                .sk-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); font-size: 13px; font-weight: 600; white-space: nowrap; }
                                .sk-pill-dot { width: 8px; height: 8px; border-radius: 50%; background: #d9f5c9; box-shadow: 0 0 0 3px rgba(217, 245, 201, 0.25); }
                                .sk-pill-dot.off { background: #c8c8c8; box-shadow: none; }
                                .sk-pill-dot.pause { background: #ffc857; box-shadow: 0 0 0 3px rgba(255, 200, 87, 0.25); }
                                .sk-hero-hint { font-size: 11px; opacity: 0.7; text-align: right; }
                            slots:
                              content:
                                - component: div
                                  config:
                                    class: [sk-hero-head]
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: [sk-hero-brand]
                                          content: Stromkreis
                                      - component: div
                                        config:
                                          class: [sk-hero-title]
                                          content: Speichermanagement
                                - component: div
                                  config:
                                    class: [sk-hero-row]
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: [sk-hero-gauge]
                                        slots:
                                          default:
                                            - component: oh-gauge
                                              config:
                                                # Kein item, sondern value per Expression: bei NULL
                                                # zeigt die Gauge sonst einen vollen Bogen.
                                                value: "=Number.isNaN(Number.parseFloat(items.Fronius_Symo_Inverter_Battery_State_of_Charge.state)) ? '0' : items.Fronius_Symo_Inverter_Battery_State_of_Charge.state"
                                                type: semicircle
                                                size: 150
                                                borderWidth: 14
                                                borderColor: "#d9f5c9"
                                                borderBgColor: rgba(255, 255, 255, 0.22)
                                                valueText: "=Number.isNaN(Number.parseFloat(items.Fronius_Symo_Inverter_Battery_State_of_Charge.state)) ? '-' : Math.round(Number.parseFloat(items.Fronius_Symo_Inverter_Battery_State_of_Charge.state)) + '%'"
                                                valueTextColor: "#ffffff"
                                                valueFontSize: 30
                                                valueFontWeight: "700"
                                                labelText: Ladestand
                                                labelTextColor: rgba(255, 255, 255, 0.8)
                                                labelFontSize: 12
                                      - component: div
                                        config:
                                          class: [sk-hero-stats]
                                        slots:
                                          default:
                                            # BEGIN batterie-stat (entfaellt ohne Batterieleistungs-Item)
                                            - component: div
                                              config:
                                                class: [sk-stat]
                                              slots:
                                                default:
                                                  - component: div
                                                    config:
                                                      class: [sk-stat-label]
                                                      content: "=Number.isNaN(Number.parseFloat(items.Fronius_Symo_Inverter_Battery_Power.state)) ? 'Batterie' : (Number.parseFloat(items.Fronius_Symo_Inverter_Battery_Power.state) < -20 ? 'Batterie lädt' : (Number.parseFloat(items.Fronius_Symo_Inverter_Battery_Power.state) > 20 ? 'Batterie entlädt' : 'Batterie ruht'))"
                                                  - component: div
                                                    config:
                                                      class: [sk-stat-value]
                                                      content: "=Number.isNaN(Number.parseFloat(items.Fronius_Symo_Inverter_Battery_Power.state)) ? '-' : (Math.abs(Number.parseFloat(items.Fronius_Symo_Inverter_Battery_Power.state)) >= 1000 ? (Math.round(Math.abs(Number.parseFloat(items.Fronius_Symo_Inverter_Battery_Power.state)) / 100) / 10).toFixed(1).replace('.', ',') + ' kW' : Math.round(Math.abs(Number.parseFloat(items.Fronius_Symo_Inverter_Battery_Power.state))) + ' W')"
                                            # END batterie-stat
                                            # BEGIN netz-stat (entfaellt ohne Netzleistungs-Item)
                                            - component: div
                                              config:
                                                class: [sk-stat]
                                              slots:
                                                default:
                                                  - component: div
                                                    config:
                                                      class: [sk-stat-label]
                                                      content: Davon ins Netz
                                                  - component: div
                                                    config:
                                                      class: [sk-stat-value]
                                                      content: "=Number.isNaN(Number.parseFloat(items.Stromkreis_BATTERIE_NETZEINSPEISUNG.state)) ? '-' : (Number.parseFloat(items.Stromkreis_BATTERIE_NETZEINSPEISUNG.state) >= 1000 ? (Math.round(Number.parseFloat(items.Stromkreis_BATTERIE_NETZEINSPEISUNG.state) / 100) / 10).toFixed(1).replace('.', ',') + ' kW' : Math.round(Number.parseFloat(items.Stromkreis_BATTERIE_NETZEINSPEISUNG.state)) + ' W')"
                                            # END netz-stat
                                - component: div
                                  config:
                                    class: [sk-hero-foot]
                                  slots:
                                    default:
                                      - component: div
                                        config:
                                          class: [sk-pill]
                                        slots:
                                          default:
                                            - component: div
                                              config:
                                                class: "=items.Stromkreis_Aktiv.state === 'ON' ? (Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? ['sk-pill-dot', 'pause'] : ['sk-pill-dot']) : ['sk-pill-dot', 'off']"
                                            - component: div
                                              config:
                                                content: "=items.Stromkreis_Aktiv.state === 'ON' ? (Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'Pausiert, noch ' + items.Stromkreis_PAUSE_TAGE.state + (Number(items.Stromkreis_PAUSE_TAGE.state) == 1 ? ' Tag' : ' Tage') : 'Speichermanagement aktiv') : (items.Stromkreis_Aktiv.state === 'OFF' ? 'Speichermanagement aus' : 'Zustand unbekannt')"
                                      - component: div
                                        config:
                                          class: [sk-hero-hint]
                                          content: Tippen zeigt den Verlauf

        # Tageszeiten der Gemeinschaft: wann geladen und wann eingespeist wird.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Heute in der Gemeinschaft
                              footer: >-
                                Zwischen diesen Zeiten erzeugt die Gemeinschaft
                                mehr Strom, als sie verbraucht - dann lädt die
                                Batterie aus der eigenen PV. Danach speist sie
                                ein; der Eigenbedarf des Hauses bis zum nächsten
                                Überschuss bleibt im Speicher.
                            slots:
                              default:
                                - component: oh-label-item
                                  config:
                                    title: Überschuss ab
                                    icon: f7:sunrise_fill
                                    iconColor: orange
                                    item: Stromkreis_Crossover_Start
                                - component: oh-label-item
                                  config:
                                    title: Überschuss bis
                                    icon: f7:sunset_fill
                                    iconColor: deeporange
                                    item: Stromkreis_Crossover_Ende

        # Hauptschalter und Navigation zu den Unterseiten; Badges zeigen den
        # Zustand der Funktionen, ohne dass man die Seite oeffnen muss.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Steuerung
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Speichermanagement
                                    subtitle: "=items.Stromkreis_Aktiv.state === 'ON' ? 'Steuert die Batterie automatisch' : (items.Stromkreis_Aktiv.state === 'OFF' ? 'Aus, Wechselrichter wie ab Werk' : 'Zustand noch unbekannt')"
                                    icon: f7:power
                                    iconColor: "=items.Stromkreis_Aktiv.state === 'ON' ? 'green' : 'gray'"
                                    item: Stromkreis_Aktiv
                                    color: green
                                - component: oh-list-item
                                  config:
                                    title: Laden bei Sonnenprognose
                                    subtitle: Lädt gebremst, abends trotzdem voll
                                    icon: f7:sun_max_fill
                                    iconColor: orange
                                    badge: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'Ein' : 'Aus'"
                                    badgeColor: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'green' : 'gray'"
                                    action: navigate
                                    actionPage: page:stromkreis_laden
                                - component: oh-list-item
                                  config:
                                    title: Einspeisen am Abend
                                    subtitle: Versorgt abends die Gemeinschaft
                                    icon: f7:moon_stars_fill
                                    iconColor: deeppurple
                                    badge: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'Ein' : 'Aus'"
                                    badgeColor: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'green' : 'gray'"
                                    action: navigate
                                    actionPage: page:stromkreis_einspeisen
                                - component: oh-list-item
                                  config:
                                    title: Pause
                                    subtitle: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'Pause läuft, Batterie wie ab Werk' : 'Bei Urlaub oder Wartung aussetzen'"
                                    icon: f7:pause_circle_fill
                                    iconColor: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'orange' : 'gray'"
                                    badge: "=Number(items.Stromkreis_PAUSE_TAGE.state) > 0 ? 'noch ' + items.Stromkreis_PAUSE_TAGE.state + (Number(items.Stromkreis_PAUSE_TAGE.state) == 1 ? ' Tag' : ' Tage') : ''"
                                    badgeColor: orange
                                    action: navigate
                                    actionPage: page:stromkreis_pause

        # Erklaerung, aufklappbar - stoert nicht, ist aber da.
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              accordionList: true
                            slots:
                              default:
                                - component: oh-list-item
                                  config:
                                    title: Wie funktioniert die Steuerung?
                                    icon: f7:info_circle_fill
                                    iconColor: blue
                                  slots:
                                    accordion:
                                      - component: f7-block
                                        config:
                                          style:
                                            margin: 0
                                            padding: 0 16px 16px 16px
                                        slots:
                                          default:
                                            - component: Label
                                              config:
                                                text: >-
                                                  Das Speichermanagement steuert die Batterie
                                                  so, dass möglichst viel Sonnenstrom in der
                                                  Energiegemeinschaft bleibt. Geladen wird ausschließlich aus der
                                                  eigenen PV-Anlage, nie aus dem Netz. Es
                                                  bestimmt nur, WANN das passiert: tagsüber
                                                  lädt die Batterie gerade so schnell, dass sie
                                                  abends voll ist, und der restliche
                                                  Sonnenstrom geht laufend an Haushalt und
                                                  Gemeinschaft. Am Abend speist die Batterie
                                                  ein, solange die Gemeinschaft mehr verbraucht
                                                  als erzeugt. Alle Prognosen kommen
                                                  automatisch von stromkreis.net.
                                                style:
                                                  white-space: normal
                                                  line-height: 1.5
                                                  font-size: 14px

  # --- Unterseite: Laden bei Sonnenprognose ----------------------------------
  stromkreis_laden:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Laden bei Sonnenprognose
    slots:
      default:
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                              footer: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'Die Batterie lädt an sonnigen Tagen automatisch gerade schnell genug, um am Abend voll zu sein. Der restliche Sonnenstrom geht laufend an Haushalt und Gemeinschaft. An trüben Tagen lädt die Batterie ungebremst.' : (items.Stromkreis_LADESPERRE_AKTIV.state === 'OFF' ? 'Die Batterie lädt aus der eigenen PV, sobald Sonne da ist.' : 'Zustand noch unbekannt - openHAB startet vermutlich gerade.')"
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Intelligentes Laden
                                    subtitle: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'Eingeschaltet' : 'Ausgeschaltet'"
                                    icon: f7:sun_max_fill
                                    iconColor: "=items.Stromkreis_LADESPERRE_AKTIV.state === 'ON' ? 'orange' : 'gray'"
                                    item: Stromkreis_LADESPERRE_AKTIV
                                    color: green
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Aktuelle Regelung
                              footer: >-
                                Ziel-Ladeleistung: mit dieser Leistung soll die
                                Batterie gerade laden, damit sie am Abend voll
                                ist; "-" heißt keine Begrenzung, die Batterie
                                lädt frei. Restladezeit: sonnengewichtete
                                Ladezeit bis zum Abend - jede Stunde zählt nur
                                mit ihrem erwarteten Ertrag laut Prognose; "-"
                                heißt gerade nicht berechenbar.
                            slots:
                              default:
                                - component: oh-label-item
                                  config:
                                    title: Ziel-Ladeleistung
                                    icon: f7:bolt_fill
                                    iconColor: orange
                                    item: Stromkreis_LADEREGELUNG_SOLL
                                - component: oh-label-item
                                  config:
                                    title: Effektive Restladezeit
                                    icon: f7:timer
                                    iconColor: blue
                                    item: Stromkreis_RESTLADEZEIT

  # --- Unterseite: Einspeisen am Abend ---------------------------------------
  stromkreis_einspeisen:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Einspeisen am Abend
    slots:
      default:
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              mediaList: true
                              stylesheet: >
                                .item-title, .item-subtitle { white-space: normal; }
                              footer: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'Die Batterie speist am Abend ins Netz ein, solange die Gemeinschaft mehr verbraucht als erzeugt (Einspeise-Zeiten unten). Liegen keine Einspeise-Zeiten vor, wird nicht eingespeist.' : (items.Stromkreis_ENTLADUNG_AKTIV.state === 'OFF' ? 'Es wird nicht automatisch eingespeist.' : 'Zustand noch unbekannt - openHAB startet vermutlich gerade.')"
                            slots:
                              default:
                                - component: oh-toggle-item
                                  config:
                                    title: Entladung verwenden
                                    subtitle: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'Eingeschaltet' : 'Ausgeschaltet'"
                                    icon: f7:moon_stars_fill
                                    iconColor: "=items.Stromkreis_ENTLADUNG_AKTIV.state === 'ON' ? 'deeppurple' : 'gray'"
                                    item: Stromkreis_ENTLADUNG_AKTIV
                                    color: green
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Heute Nacht
                              footer: >-
                                Eingespeist wird, sobald die Gemeinschaft am
                                Abend laut Prognose im Defizit ist (ohne
                                tagesaktuelle Zeit: eine Stunde nach dem
                                Abend-Crossover), bis die Gemeinschaft am
                                Morgen wieder mehr erzeugt als verbraucht.
                                Hauslast: nächtlicher Verbrauch des Hauses,
                                gelernt aus dem Ladestandsabfall ohne
                                Einspeisung.
                            slots:
                              default:
                                - component: oh-label-item
                                  config:
                                    title: Einspeisung ab
                                    icon: f7:sunset_fill
                                    iconColor: deeporange
                                    item: Stromkreis_Entladestart
                                    after: "=(items.Stromkreis_Entladestart.state && items.Stromkreis_Entladestart.state !== '-' && items.Stromkreis_Entladestart.state !== 'NULL' && items.Stromkreis_Entladestart.state !== 'UNDEF') ? items.Stromkreis_Entladestart.state : items.Stromkreis_Crossover_Ende.state"
                                - component: oh-label-item
                                  config:
                                    title: Einspeisung bis
                                    icon: f7:sunrise_fill
                                    iconColor: orange
                                    item: Stromkreis_Crossover_Start
                                - component: oh-label-item
                                  config:
                                    title: Geschätzte Hauslast
                                    icon: f7:house_fill
                                    iconColor: teal
                                    item: Stromkreis_HAUSLAST
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-list-card
                            config:
                              title: Reserve
                              footer: >-
                                Unter diesem Ladestand stoppt die Einspeisung -
                                diese Reserve bleibt für den eigenen Haushalt.
                            slots:
                              default:
                                - component: oh-stepper-item
                                  config:
                                    title: Reserve-Ladestand (%)
                                    icon: f7:battery_25
                                    iconColor: green
