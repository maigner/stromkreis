[project]
name = "stromkreis-pipeline"
version = "0.1.0"
description = "Stromkreis data pipeline: EEG-Faktura import, weather import, forecast runs"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "pandas",
    "requests",
    "psycopg[binary]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stromkreis_pipeline"]
