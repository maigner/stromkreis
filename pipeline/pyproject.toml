[project]
name = "stromkreis-pipeline"
version = "0.1.0"
description = "Stromkreis data pipeline: EEG-Faktura import, weather import, forecast runs"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
# Untergrenzen; die exakten Versionen des Docker-Images stehen in requirements.lock
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stromkreis_pipeline"]
